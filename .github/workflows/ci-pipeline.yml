name: CI Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno (.NET 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore MaquinaCafe.slnx

      - name: Compilar proyecto
        run: dotnet build MaquinaCafe.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas (TDD)
        run: dotnet test MaquinaCafe.slnx --configuration Release --no-build --verbosity normal
